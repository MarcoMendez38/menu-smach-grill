<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR del menú | Smach & Grill</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body { align-items: center; display: flex; min-height: 100vh; }
      .qr-page { margin: auto; max-width: 560px; padding: 40px 20px; text-align: center; width: 100%; }
      .qr-card { background: var(--paper); border-radius: 10px; box-shadow: var(--shadow); padding: 34px; }
      .qr-card h1 { font-size: 42px; margin: 0 0 8px; }
      .qr-card p { color: var(--muted); font-size: 14px; }
      .qr-image { background: white; border: 10px solid white; border-radius: 4px; display: block; height: 300px; margin: 25px auto; max-width: 100%; width: 300px; }
      .qr-url { background: var(--cream); border-radius: 4px; color: var(--deep-sage); display: block; font-size: 13px; overflow-wrap: anywhere; padding: 11px; }
      .qr-help { font-size: 12px !important; margin-bottom: 25px; }
      @media print { .print-button { display: none; } body { background: white; } .qr-card { box-shadow: none; } }
    </style>
  </head>
  <body>
    <main class="qr-page">
      <div class="qr-card">
        <p class="eyebrow">Smach & Grill</p>
        <h1>Escaneá para ver el menú</h1>
        <p class="qr-help">Apuntá la cámara de tu celular al código para abrir el menú digital.</p>
        <img class="qr-image" id="qr-image" alt="Código QR para abrir el menú de Smach y Grill" />
        <code class="qr-url" id="qr-url"></code>
        <button class="button button-primary print-button" type="button" onclick="window.print()">Imprimir QR</button>
      </div>
    </main>
    <script>
      const menuUrl = `${window.location.origin}/`;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=20&data=${encodeURIComponent(menuUrl)}`;
      document.querySelector("#qr-image").src = qrUrl;
      document.querySelector("#qr-url").textContent = menuUrl;
    </script>
  </body>
</html>
