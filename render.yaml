services:
  - type: web
    name: smach-grill-menu
    runtime: python
    buildCommand: "cd angular-app && npm ci && npm run build && cd .. && python3 -m py_compile server.py"
    startCommand: "python3 server.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: MENU_SECRET
        sync: false
